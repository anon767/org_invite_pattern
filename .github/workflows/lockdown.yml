name: Lockdown

# Every 10 minutes: make every repo in the org private (except this one)
# and give the graders team read access.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: lockdown

jobs:
  lockdown:
    # Skipped until the App is configured (e.g. in the template repo itself).
    if: vars.APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/github-script@v9
        env:
          GRADERS_TEAM: ${{ vars.GRADERS_TEAM || 'graders' }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/lockdown.cjs')({ github, context, core })
